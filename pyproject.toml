[project]
name = "avogadro-orthonym"
version = "0.1.0"
description = "Orthonym IUPAC naming plugin for Avogadro 2"
authors = [{name = "Geoff Hutchison", email = "geoff.hutchison@gmail.com"}]
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = ["orthonym>=1.0.5", "rdkit"]

[project.scripts]
avogadro-orthonym = "avogadro_orthonym:main"
avogadro-orthonym-setup = "avogadro_orthonym:setup"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.avogadro]
minimum-avogadro-version = "1.103"

[[tool.avogadro.menu-commands]]
identifier = "name"
input-format = "sdf"
menu = "Analyze"
submenu = "Properties"
item = "Orthonym Name…"
menu-priorities = [ 900, 290 ]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11"
# Orthonym runs OPSIN and centres on a JVM (via JPype)
openjdk = "21.*"

[tool.pixi.pypi-dependencies]
avogadro-orthonym = { path = ".", editable = true }

[tool.pixi.tasks]
